[project]
name = "audit-kit"
version = "0.18.0"
description = "Deterministic helpers for agent-audit-kit: detect, seed and verify."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.5.6",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
]

[project.scripts]
audit-kit = "audit_kit.cli:main"

[dependency-groups]
dev = [
  "bandit>=1.8",
  "hypothesis>=6.170,<7",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "semgrep>=1.100",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S", "UP", "C4", "SIM", "RUF", "D"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: assert is the test idiom, fixtures are synthetic, test functions are named
# for behaviour rather than documented one by one, and end-to-end tests start git by
# name on a deliberately limited PATH.
"tests/**" = ["S101", "S603", "S607", "D100", "D103"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]
# Two conftest.py files (tests/ and tests/unit/file_review/) need module names
# from their paths: src/ is the package root for audit_kit, . for tests.
explicit_package_bases = true
mypy_path = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short --import-mode=importlib"
markers = [
  "e2e: drives bin/kit end to end in a throwaway repository (needs git and bash)",
  "node: needs a local Node.js runtime",
  "integration: runs a real subprocess against real timing (slower; deterministic enough to run by default)",
]

[tool.coverage.run]
branch = true
source_pkgs = ["audit_kit"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
